# TensorRT Deployment Configuration

deployment:
  engine: "tensorrt"
  output_path: "./exports/model.engine"
  
# Model configuration
model:
  config: "configs/model/mobilevit_small.yaml"
  onnx_path: "./exports/model.onnx"
  
# TensorRT settings
tensorrt:
  precision: "fp16"  # fp32, fp16, int8
  
  # INT8 quantization settings
  int8:
    calibration_data: "./data/calibration"
    num_calibration_samples: 500
    calibration_cache: "./exports/calibration.cache"
    
  # Optimization settings
  max_batch_size: 1
  max_workspace_size: 2147483648  # 2GB
  allow_gpu_fallback: true
  
  # Dynamic shapes (if supported)
  dynamic_shapes:
    enabled: false
    profiles:
      - min: [1, 3, 320, 320]
        opt: [1, 3, 320, 320]
        max: [1, 3, 640, 640]
        
# Input specification
input:
  batch_size: 1
  channels: 3
  height: 320
  width: 320

# Performance settings
performance:
  use_cudnn: true
  use_cuda_graph: false
  dla_core: -1  # Use GPU
  
# Logging
logging:
  level: "warning"  # verbose, info, warning, error
  timing_cache: "./exports/timing_cache.json"
