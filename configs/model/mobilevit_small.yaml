# MobileViT-Small Model Configuration
# Lightweight Vision Transformer for Object Detection

model:
  name: "mobilevit_small"
  type: "detector"
  
  # Backbone configuration
  backbone:
    name: "mobilevit_small"
    image_size: 320
    patch_size: 2
    width_multiplier: 0.5
    
    # MobileViT blocks configuration
    blocks:
      - type: "mv2"
        out_channels: 32
        stride: 1
        num_blocks: 1
      - type: "mv2"
        out_channels: 64
        stride: 2
        num_blocks: 3
      - type: "mobilevit"
        out_channels: 96
        stride: 2
        transformer_channels: 144
        transformer_blocks: 2
        patch_size: 2
      - type: "mobilevit"
        out_channels: 128
        stride: 2
        transformer_channels: 192
        transformer_blocks: 4
        patch_size: 2
      - type: "mobilevit"
        out_channels: 160
        stride: 2
        transformer_channels: 240
        transformer_blocks: 3
        patch_size: 2

  # Feature Pyramid Network
  neck:
    name: "fpn"
    in_channels: [80, 160, 320]  # Actual MobileViT-Small output channels
    out_channels: 128
    num_levels: 3
    
  # Detection Head
  head:
    name: "detection_head"
    num_classes: 80  # COCO classes
    num_anchors: 3
    num_convs: 4
    in_channels: 128
    use_depthwise: true
    
  # Lightweight attention settings
  attention:
    type: "linear"  # linear, pool, efficient
    num_heads: 4
    dropout: 0.1
    use_flash_attention: false

# Model size estimation
params:
  total: ~5.6M  # ~5.6 million parameters
  size_mb: ~22  # ~22 MB model size

# Performance targets
targets:
  mAP_50: 0.75  # Target mAP@0.5 on COCO
  fps: 30       # Target FPS on RTX 3060
  memory_mb: 500  # Max inference memory in MB
